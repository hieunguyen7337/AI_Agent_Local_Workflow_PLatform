schema_version: workflow.graph/v1
name: person_reid_market1501_eval
description: >-
  Eval-friendly person re-identification pipeline for a 100-query / 500-gallery
  Market-1501 partition. Attribute and query embedding representations are
  loaded from offline DBs; fusion uses hardcoded embedding-heavy weights
  (emb=0.9 / attr=0.1) derived from per-branch ablation on the eval set.
category: agentic
tags:
  - person-reid
  - multimodal
  - retrieval
  - market1501
  - eval
budget:
  cost_usd: 0.10
  latency_ms: 120000
entry: start
nodes:
  - id: start
    kind: python_tool
    name: Mark workflow start
    description: Marks the explicit workflow start node without reading databases, ranking candidates, or changing user state.
    callable_path: backend.tools.reid_specialists.mark_workflow_start
    inputs:
      user_input: user_input
    output_state_key: start_marker

  - id: llm_attribute_lookup
    kind: python_tool
    name: Lookup query attributes from eval DB
    description: Reads precomputed query pedestrian attributes from the offline eval query attribute database.
    callable_path: backend.tools.reid_specialists.lookup_query_attributes_from_eval_db
    inputs:
      query_id: user_input
      query_db_path: query_db_path
    output_state_key: query_llm_attributes

  - id: llm_attribute_retriever
    kind: python_tool
    name: Retrieve gallery by attribute similarity
    description: Performs local SQLite retrieval by comparing query attributes against the offline gallery attribute database.
    callable_path: backend.tools.reid_specialists.retrieve_gallery_by_attribute_similarity
    inputs:
      query_attributes: query_llm_attributes
      gallery_db_path: gallery_db_path
      top_k: retrieval_top_k
    output_state_key: llm_attribute_ranked

  - id: multimodal_embedding_lookup
    kind: python_tool
    name: Lookup query ReID embedding from eval DB
    description: Reads the precomputed query ReID multimodal embedding from the offline eval embedding database.
    callable_path: backend.tools.reid_specialists.lookup_query_reid_embedding_from_eval_db
    inputs:
      query_id: user_input
      query_embedding_db_path: query_embedding_db_path
    output_state_key: query_multimodal_embedding

  - id: reid_multimodal_embedding_retriever
    kind: vector_retriever
    index_path: "{gallery_embedding_db_path}"
    query_embedding_state_key: query_multimodal_embedding
    output_state_key: reid_multimodal_embedding_ranked
    top_k: 20

  - id: weighted_reciprocal_rank_fusion
    kind: python_tool
    name: Weighted reciprocal rank fusion
    description: Fuses attribute and ReID embedding candidate rankings using embedding-heavy RRF weights (emb=0.9 / attr=0.1).
    callable_path: backend.tools.reid_specialists.weighted_reciprocal_rank_fusion
    inputs:
      llm_attribute_ranked: llm_attribute_ranked
      reid_multimodal_embedding_ranked: reid_multimodal_embedding_ranked
    output_state_key: ranked_gallery_ids

edges:
  - from: start
    to: llm_attribute_lookup
  - from: start
    to: multimodal_embedding_lookup
  - from: llm_attribute_lookup
    to: llm_attribute_retriever
  - from: multimodal_embedding_lookup
    to: reid_multimodal_embedding_retriever
  - from: llm_attribute_retriever
    to: weighted_reciprocal_rank_fusion
  - from: reid_multimodal_embedding_retriever
    to: weighted_reciprocal_rank_fusion
  - from: weighted_reciprocal_rank_fusion
    to: __end__
