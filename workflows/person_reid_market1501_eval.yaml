schema_version: workflow.graph/v1
name: person_reid_market1501_eval
description: >-
  Eval-friendly person re-identification pipeline for a 1000-query / 5000-gallery
  Market-1501 partition. It has three explicitly named retrieval paths, each
  represented by one query-side python_tool lookup against the Gemma retrieval
  score DB. Path 1, eval_visual_image_embedding, reads a precomputed visual
  top-200 ranking. Path 2, eval_description_semantic_text, reads a precomputed
  description-text embedding top-200 ranking. Path 3,
  eval_description_structured_facets, reads a precomputed structured-facet
  top-200 ranking. Adaptive RRF fusion combines all three.
category: agentic
tags:
  - person-reid
  - multimodal
  - retrieval
  - market1501
  - eval
budget:
  cost_usd: 0.10
  latency_ms: 120000
entry: start
nodes:
  - id: start
    kind: python_tool
    name: Mark workflow start
    description: Marks the explicit workflow start node without reading databases, ranking candidates, or changing user state.
    callable_path: backend.tools.reid_specialists.mark_workflow_start
    inputs:
      user_input: user_input
    output_state_key: start_marker

  - id: multimodal_embedding_lookup
    kind: python_tool
    name: Path 1 - eval_visual_image_embedding precomputed ranking lookup
    description: >-
      Single query-side python node for the visual path. Reads top-200 gallery
      IDs for channel visual_image_embedding from the Gemma retrieval score DB.
      Example: query_id "0004_c3s3_065619_00.jpg" returns gallery IDs ranked by
      query-image embedding vs gallery-image embedding cosine score.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_visual_image_embedding
      top_k: retrieval_score_top_k
    output_state_key: reid_multimodal_embedding_ranked

  - id: description_embedding_lookup
    kind: python_tool
    name: Path 2 - eval_description_semantic_text precomputed ranking lookup
    description: >-
      Single query-side python node for the semantic text path. Reads top-200
      gallery IDs for channel description_semantic_text from the Gemma retrieval
      score DB. Example: "white short-sleeved t-shirt and dark shorts" returns
      gallery IDs ranked by query-description embedding vs gallery-description
      embedding cosine score.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_description_semantic_text
      top_k: retrieval_score_top_k
    output_state_key: description_semantic_ranked

  - id: description_lookup
    kind: python_tool
    name: Path 3 - eval_description_structured_facets precomputed ranking lookup
    description: >-
      Single query-side python node for the structured facet path. Reads top-200
      gallery IDs for channel description_structured_facets from the Gemma
      retrieval score DB. Example: "red short-sleeved t-shirt, black shorts,
      backpack" returns gallery IDs ranked by region-aware facet score.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_description_structured_facets
      top_k: retrieval_score_top_k
    output_state_key: description_facets_ranked

  - id: adaptive_fusion_weight_router
    kind: python_tool
    name: Decide adaptive ReID fusion weights
    description: >-
      Detects strong agreement between eval_description_semantic_text and
      eval_description_structured_facets. If their shared top candidate is weak
      or absent in eval_visual_image_embedding, it emits description-heavy
      weights; otherwise it keeps visual-heavy defaults.
    callable_path: backend.tools.reid_specialists.decide_reid_fusion_weights
    inputs:
      reid_multimodal_embedding_ranked: reid_multimodal_embedding_ranked
      description_semantic_ranked: description_semantic_ranked
      description_facets_ranked: description_facets_ranked
    output_state_key: fusion_weight_analysis

  - id: weighted_reciprocal_rank_fusion
    kind: python_tool
    name: Fuse eval_visual_image_embedding + eval_description_semantic_text + eval_description_structured_facets
    description: >-
      Combines the three precomputed path rankings with weighted reciprocal-rank
      fusion. The adaptive router can reverse emphasis toward the two
      description paths when semantic and facet paths agree but the visual path
      disagrees.
    callable_path: backend.tools.reid_specialists.weighted_reciprocal_rank_fusion
    inputs:
      reid_multimodal_embedding_ranked: reid_multimodal_embedding_ranked
      description_semantic_ranked: description_semantic_ranked
      description_facets_ranked: description_facets_ranked
      fusion_weight_analysis: fusion_weight_analysis
    output_state_key: ranked_gallery_ids

edges:
  - from: start
    to: multimodal_embedding_lookup
  - from: start
    to: description_embedding_lookup
  - from: start
    to: description_lookup
  - from: multimodal_embedding_lookup
    to: adaptive_fusion_weight_router
  - from: description_embedding_lookup
    to: adaptive_fusion_weight_router
  - from: description_lookup
    to: adaptive_fusion_weight_router
  - from: adaptive_fusion_weight_router
    to: weighted_reciprocal_rank_fusion
  - from: weighted_reciprocal_rank_fusion
    to: __end__
