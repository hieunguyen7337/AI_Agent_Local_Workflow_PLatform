schema_version: workflow.graph/v1
name: person_reid_market1501_eval
description: >-
  Four-path eval-friendly Market-1501 person ReID pipeline. It uses precomputed
  Torchreid visual rankings, precomputed FastReID visual rankings, precomputed
  description semantic rankings, and precomputed structured facet rankings.
  Runtime work is SQLite lookup plus configurable weighted RRF only.
category: agentic
tags:
  - person-reid
  - torchreid
  - fastreid
  - multimodal
  - retrieval
  - market1501
  - eval
budget:
  cost_usd: 0.10
  latency_ms: 120000
entry: start
nodes:
  - id: start
    kind: python_tool
    name: Mark workflow start
    description: Marks the explicit workflow start node without reading databases, ranking candidates, or changing user state.
    callable_path: backend.tools.reid_specialists.mark_workflow_start
    inputs:
      user_input: user_input
    output_state_key: start_marker

  - id: torchreid_visual_lookup
    kind: python_tool
    name: Path 1 - Torchreid visual ReID precomputed ranking lookup
    description: Reads top-k gallery IDs for the Torchreid OSNet visual ReID channel.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_torchreid_visual_embedding
      top_k: retrieval_score_top_k
    output_state_key: torchreid_visual_ranked

  - id: fastreid_visual_lookup
    kind: python_tool
    name: Path 2 - FastReID visual ReID precomputed ranking lookup
    description: Reads top-k gallery IDs for the FastReID SBS R101-IBN visual ReID channel.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_fastreid_visual_embedding
      top_k: retrieval_score_top_k
    output_state_key: fastreid_visual_ranked

  - id: description_embedding_lookup
    kind: python_tool
    name: Path 3 - description_semantic_text precomputed ranking lookup
    description: Reads top-k gallery IDs for the retained description semantic text channel.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_description_semantic_text
      top_k: retrieval_score_top_k
    output_state_key: description_semantic_ranked

  - id: description_lookup
    kind: python_tool
    name: Path 4 - description_structured_facets precomputed ranking lookup
    description: Reads top-k gallery IDs for the retained structured facet channel.
    callable_path: backend.tools.reid_specialists.lookup_precomputed_retrieval_ranking
    inputs:
      query_id: user_input
      retrieval_score_db_path: retrieval_score_db_path
      channel: channel_description_structured_facets
      top_k: retrieval_score_top_k
    output_state_key: description_facets_ranked

  - id: weighted_dual_reid_reciprocal_rank_fusion
    kind: python_tool
    name: Fuse Torchreid + FastReID + description retrieval paths
    description: >-
      Combines Torchreid visual, FastReID visual, semantic description, and
      structured facet rankings with configurable weighted reciprocal-rank
      fusion. Set any path weight to 0 for ablations.
    callable_path: backend.tools.reid_specialists.weighted_dual_reid_reciprocal_rank_fusion
    inputs:
      torchreid_visual_ranked: torchreid_visual_ranked
      fastreid_visual_ranked: fastreid_visual_ranked
      description_semantic_ranked: description_semantic_ranked
      description_facets_ranked: description_facets_ranked
      fusion_weight_config: fusion_weight_config
    output_state_key: ranked_gallery_ids

edges:
  - from: start
    to: torchreid_visual_lookup
  - from: start
    to: fastreid_visual_lookup
  - from: start
    to: description_embedding_lookup
  - from: start
    to: description_lookup
  - from: torchreid_visual_lookup
    to: weighted_dual_reid_reciprocal_rank_fusion
  - from: fastreid_visual_lookup
    to: weighted_dual_reid_reciprocal_rank_fusion
  - from: description_embedding_lookup
    to: weighted_dual_reid_reciprocal_rank_fusion
  - from: description_lookup
    to: weighted_dual_reid_reciprocal_rank_fusion
  - from: weighted_dual_reid_reciprocal_rank_fusion
    to: __end__
