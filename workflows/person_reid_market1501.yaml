schema_version: workflow.graph/v1
name: person_reid_market1501
description: >-
  Person re-identification pipeline with explicit attribute and multimodal
  embedding branches over offline gallery databases. Fusion uses embedding-heavy
  RRF weights (emb=0.9 / attr=0.1) derived from per-branch ablation on
  Market-1501 eval data.
category: agentic
tags:
  - person-reid
  - multimodal
  - retrieval
  - market1501
budget:
  cost_usd: 1.50
  latency_ms: 600000
entry: start
nodes:
  - id: start
    kind: python_tool
    name: Mark workflow start
    description: Marks the explicit workflow start node without reading databases, ranking candidates, or changing user state.
    callable_path: backend.tools.reid_specialists.mark_workflow_start
    inputs:
      user_input: user_input
    output_state_key: start_marker

  - id: llm_attribute_parser
    kind: llm
    provider: openrouter
    model: qwen/qwen3.5-9b
    system_prompt: >-
      You label visible pedestrian attributes for person re-identification.
      Return only the requested raw JSON object.
    user_prompt_template: |-
      Label the main pedestrian in this image.
      If multiple people are visible, focus on the most prominent (largest/most central) person.
      If a body region is occluded or cropped, infer from whatever is visible.

      Return only a raw JSON object with these exact keys and text values:

      {{
        "gender":               "male" | "female",
        "hair":                 "short" | "long",
        "clothing_type":        "dress" | "pants" | "shorts" | "skirt",
        "upper_body_clothes":   "long sleeve" | "short sleeve",
        "lower_body_clothes":   "long" | "short",
        "hat":                  "no" | "yes",
        "backpack":             "no" | "yes",
        "bag":                  "no" | "yes",
        "handbag":              "no" | "yes"
      }}

      No markdown, no explanation - raw JSON only.
    output_state_key: query_llm_attributes
    image_inputs:
      - state_key: query_image_path
        detail: auto
    temperature: 0.0

  - id: llm_attribute_retriever
    kind: python_tool
    name: Retrieve gallery by attribute similarity
    description: Performs local SQLite retrieval by comparing query LLM attributes against the offline gallery attribute database.
    callable_path: backend.tools.reid_specialists.retrieve_gallery_by_attribute_similarity
    inputs:
      query_attributes: query_llm_attributes
      gallery_db_path: gallery_db_path
      top_k: retrieval_top_k
    output_state_key: llm_attribute_ranked

  - id: reid_multimodal_embedding
    kind: embedding
    provider: openrouter
    model: google/gemini-embedding-2-preview
    input_template: ""
    image_inputs:
      - state_key: query_image_path
        detail: auto
    output_state_key: query_multimodal_embedding

  - id: reid_multimodal_embedding_retriever
    kind: vector_retriever
    index_path: "{gallery_embedding_db_path}"
    query_embedding_state_key: query_multimodal_embedding
    output_state_key: reid_multimodal_embedding_ranked
    top_k: 20

  - id: weighted_reciprocal_rank_fusion
    kind: python_tool
    name: Weighted reciprocal rank fusion
    description: Fuses attribute and ReID embedding candidate rankings using embedding-heavy RRF weights (emb=0.9 / attr=0.1).
    callable_path: backend.tools.reid_specialists.weighted_reciprocal_rank_fusion
    inputs:
      llm_attribute_ranked: llm_attribute_ranked
      reid_multimodal_embedding_ranked: reid_multimodal_embedding_ranked
    output_state_key: ranked_gallery_ids

edges:
  - from: start
    to: llm_attribute_parser
  - from: start
    to: reid_multimodal_embedding
  - from: llm_attribute_parser
    to: llm_attribute_retriever
  - from: reid_multimodal_embedding
    to: reid_multimodal_embedding_retriever
  - from: llm_attribute_retriever
    to: weighted_reciprocal_rank_fusion
  - from: reid_multimodal_embedding_retriever
    to: weighted_reciprocal_rank_fusion
  - from: weighted_reciprocal_rank_fusion
    to: __end__
